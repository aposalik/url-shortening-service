<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>URL Shortener</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 16px; }
    h1 { font-size: 2rem; color: #1a1a2e; margin-bottom: 8px; }
    p.sub { color: #666; margin-bottom: 32px; }
    .card { background: white; border-radius: 12px; padding: 24px; width: 100%; max-width: 600px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 24px; }
    .input-row { display: flex; gap: 10px; }
    input[type="text"] { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; transition: border 0.2s; }
    input[type="text"]:focus { border-color: #6c63ff; }
    button { padding: 12px 20px; background: #6c63ff; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
    button:hover { background: #574fd6; }
    button.danger { background: #ff4d4f; }
    button.danger:hover { background: #d9363e; }
    button.secondary { background: #e0e0e0; color: #333; }
    button.secondary:hover { background: #ccc; }
    #message { margin-top: 14px; font-size: 0.95rem; color: #6c63ff; min-height: 20px; }
    #message.error { color: #ff4d4f; }
    h2 { font-size: 1.2rem; color: #1a1a2e; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; padding: 10px 12px; background: #f7f7fb; color: #888; font-weight: 600; border-bottom: 1px solid #eee; }
    td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; word-break: break-all; }
    tr:last-child td { border-bottom: none; }
    .short-link { color: #6c63ff; text-decoration: none; font-weight: 500; }
    .short-link:hover { text-decoration: underline; }
    .actions { display: flex; gap: 6px; }
    .empty { text-align: center; color: #aaa; padding: 24px 0; }
    .edit-input { width: 100%; padding: 6px 10px; border: 1px solid #6c63ff; border-radius: 6px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>🔗 URL Shortener</h1>
  <p class="sub">Paste a long URL and get a short link instantly</p>

  <div class="card">
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://example.com/very/long/url..." />
      <button onclick="createShortUrl()">Shorten</button>
    </div>
    <div id="message"></div>
  </div>

  <div class="card">
    <h2>Your Short Links</h2>
    <table>
      <thead>
        <tr>
          <th>Original URL</th>
          <th>Short Link</th>
          <th>Clicks</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="urlTable">
        <tr><td colspan="4" class="empty">No links yet. Shorten one above!</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const BASE = '';
    let urls = [];

    function showMessage(text, isError = false) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = isError ? 'error' : '';
    }

    function getBaseUrl() {
      return window.location.origin;
    }

    async function createShortUrl() {
      const input = document.getElementById('urlInput');
      const url = input.value.trim();
      if (!url) return showMessage('Please enter a URL.', true);

      const res = await fetch('/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });

      if (!res.ok) return showMessage('Failed to shorten URL.', true);
      const data = await res.json();
      urls.unshift(data);
      input.value = '';
      showMessage(`✅ Short link created: ${getBaseUrl()}/shorten/r/${data.shortCode}`);
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('urlTable');
      if (urls.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No links yet. Shorten one above!</td></tr>';
        return;
      }
      tbody.innerHTML = urls.map((u, i) => `
        <tr id="row-${i}">
          <td id="orig-${i}">${truncate(u.url)}</td>
          <td><a class="short-link" href="/shorten/r/${u.shortCode}" target="_blank">${getBaseUrl()}/shorten/r/${u.shortCode}</a></td>
          <td>${u.accessCount}</td>
          <td class="actions">
            <button class="secondary" onclick="startEdit(${i})">Edit</button>
            <button class="danger" onclick="deleteUrl('${u.shortCode}', ${i})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function truncate(str, n = 40) {
      return str.length > n ? str.slice(0, n) + '…' : str;
    }

    function startEdit(i) {
      const u = urls[i];
      const origTd = document.getElementById(`orig-${i}`);
      const row = document.getElementById(`row-${i}`);
      origTd.innerHTML = `<input class="edit-input" id="edit-input-${i}" value="${u.url}" />`;
      const actionsTd = row.querySelector('.actions');
      actionsTd.innerHTML = `
        <button onclick="saveEdit(${i}, '${u.shortCode}')">Save</button>
        <button class="secondary" onclick="renderTable()">Cancel</button>
      `;
    }

    async function saveEdit(i, shortCode) {
      const newUrl = document.getElementById(`edit-input-${i}`).value.trim();
      if (!newUrl) return;
      const res = await fetch(`/shorten/${shortCode}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: newUrl })
      });
      if (!res.ok) return showMessage('Update failed.', true);
      const data = await res.json();
      urls[i] = data;
      showMessage('✅ URL updated.');
      renderTable();
    }

    async function deleteUrl(shortCode, i) {
      if (!confirm('Delete this short link?')) return;
      const res = await fetch(`/shorten/${shortCode}`, { method: 'DELETE' });
      if (res.status === 204) {
        urls.splice(i, 1);
        showMessage('🗑️ Deleted.');
        renderTable();
      } else {
        showMessage('Delete failed.', true);
      }
    }
  </script>
</body>
</html>
